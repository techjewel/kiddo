<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magnet Board favicon</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
  /* A tab favicon is 16 real pixels. Four magnets there is grey mush,
     so the small end gets one tile and one letter. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 256px; height: 256px; }
  body { display: grid; place-items: center; background: transparent; }
  .m {
    --c: #E24A3F;
    width: 236px; height: 236px;
    display: grid; place-items: center;
    border-radius: 19%;
    color: #fff;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800; font-size: 158px; line-height: 1;
    padding-bottom: 0.06em;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--c) 100%, white 26%),
      var(--c) 52%,
      color-mix(in srgb, var(--c) 100%, black 12%));
    box-shadow:
      inset 0 3px 0 rgba(255,255,255,0.5),
      inset 0 -5px 0 rgba(0,0,0,0.18);
  }
</style>
</head>
<body><div class="m">A</div></body>
</html>
