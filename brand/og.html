<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magnet Board social card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Baloo+Da+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* 1200×630 — the size Facebook, X, LinkedIn, WhatsApp, Slack and
     iMessage all crop from. Rendered by brand/render.sh; not shipped.
     Everything here is the app's own recipe so the card and the app
     look like the same object.

     The card leads with the languages, because that is the part of the
     board a stranger cannot guess from the name. Three of the four
     alphabets are on magnets — A, অ and Ñ, each in the colour its own
     language starts on — and the switch underneath names all four in
     their own words, which is how the app names them too. */
  :root {
    --m1: #E24A3F; --m2: #F2A122; --m3: #34A05B;
    --m4: #2E6BD4; --m5: #8B4FCF; --m6: #12A0A0;
    --door-hi: #F4F7FA; --door-lo: #DDE4EC;
    --ink: #21252C; --ink-soft: #5A6472;
    --font-display: 'Baloo 2', sans-serif;
    --font-bangla: 'Baloo Da 2', sans-serif;
    --font-emoji: 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 40px;
    padding: 0 74px;
    font-family: var(--font-display);
    color: var(--ink);
    background-color: var(--door-hi);
    background-image:
      repeating-linear-gradient(90deg,
        rgba(255,255,255,0.30) 0 4px, rgba(33,37,44,0.010) 4px 9px),
      linear-gradient(158deg, #FBFCFE 0%, var(--door-hi) 46%, var(--door-lo) 100%);
  }

  /* ---- left: what it is ---- */
  .say { width: 606px; flex: none; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    margin-bottom: 20px;
    padding: 9px 18px 9px 14px;
    border-radius: 999px;
    font-size: 21px; font-weight: 600; letter-spacing: 0.01em;
    color: var(--ink-soft);
    background: rgba(255,255,255,0.72);
    box-shadow: inset 0 0 0 1.5px rgba(33,37,44,0.08);
  }
  .eyebrow b { color: var(--m1); font-weight: 800; }

  h1 {
    font-size: 88px; font-weight: 800; line-height: 0.95;
    letter-spacing: -0.015em;
  }
  .tag {
    margin-top: 18px;
    font-size: 31px; font-weight: 600; line-height: 1.3;
    color: var(--ink-soft);
  }

  /* The app's own language switch. Each side is written in its own
     language, because a button labelled "Bangla" in Latin type is a
     grown-up's label for it, and exactly one is lit, which is the whole
     rule: one language on the screen at a time.

     The flags are the card's own doing and are not in the app. At the
     size a card is actually seen — a thumbnail in a chat list — 22px
     type is a grey smear, and four flags read as four languages before
     a single word is legible. They stand for the language, not the
     country: 🇬🇧 because the app is written in British English down to
     "colours", and 🇧🇩 for বাংলা, which is also spoken either side of
     that border. */
  .segmented {
    display: inline-flex; gap: 4px;
    margin-top: 30px; padding: 5px;
    border-radius: 999px;
    background: rgba(33,37,44,0.09);
  }
  .segmented i {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 15px;
    border-radius: 999px;
    font-style: normal; font-size: 21px; font-weight: 600;
    white-space: nowrap;
    color: var(--ink-soft);
  }
  .segmented i s {
    font-family: var(--font-emoji);
    font-size: 21px; text-decoration: none;
    line-height: 1;
  }
  .segmented i.on {
    color: var(--ink);
    background: #fff;
    box-shadow: 0 1px 3px rgba(33,37,44,0.18);
  }
  .segmented i.bn { font-family: var(--font-bangla); font-size: 23px; }

  /* The rail and the address share the last line. The rail is 387px in
     a 606px column and the address fills what it leaves, which is what
     that space was going to be either way. */
  .foot {
    display: flex; align-items: center; gap: 15px;
    margin-top: 34px;
  }
  /* The scheme is here to say "this is a web address", which `.com`
     says by itself and `.page` does not — a lot of people have never
     seen the TLD and read a bare kiddo.page as a brand name. It is set
     smaller and lighter than the domain so it does that job without
     becoming the thing you read first. */
  .url {
    font-size: 24px; font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--m4);
  }
  .url s {
    font-size: 18px; font-weight: 600;
    text-decoration: none;
    color: color-mix(in srgb, var(--m4) 100%, white 38%);
  }

  /* The app's own bottom bar, shrunk. It is the most recognisable
     thing on the screen after the magnets, and it is where the rest of
     the board — numbers, pictures, colours, shapes, the boy — lives. */
  .rail {
    display: inline-flex; gap: 5px;
    padding: 8px;
    border-radius: 999px;
    background: var(--ink);
    box-shadow: 0 10px 26px rgba(33,37,44,0.28);
  }
  .rail i {
    display: grid; place-items: center;
    width: 42px; height: 42px;
    border-radius: 13px;
    font-style: normal; font-size: 23px; font-weight: 800;
    color: rgba(255,255,255,0.78);
    background: rgba(255,255,255,0.14);
  }
  .rail i.on { background: var(--m2); color: #40260A; }
  .rail i.bn { font-family: var(--font-bangla); font-size: 25px; }
  .rail i.em { font-family: var(--font-emoji); font-size: 20px; }

  /* ---- right: the magnets ---- */
  .board {
    display: grid;
    grid-template-columns: 190px 190px;
    gap: 26px;
  }
  .m {
    width: 190px; height: 190px;
    display: grid; place-items: center;
    border-radius: 19%;
    color: #fff;
    font-weight: 800; font-size: 108px; line-height: 1;
    padding-bottom: 0.06em;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--c) 100%, white 26%),
      var(--c) 52%,
      color-mix(in srgb, var(--c) 100%, black 12%));
    box-shadow:
      inset 0 4px 0 rgba(255,255,255,0.5),
      inset 0 -6px 0 rgba(0,0,0,0.18),
      0 7px 0 color-mix(in srgb, var(--c) 100%, black 30%),
      0 14px 26px rgba(33,37,44,0.24);
    text-shadow: 0 3px 0 rgba(0,0,0,0.16);
    transform: rotate(var(--t));
  }
  .m.bn { font-family: var(--font-bangla); }

  /* A picture magnet, exactly as the app draws one: white face,
     coloured rim, real photograph, name underneath. */
  .m.pic {
    flex-direction: column;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    padding: 12px;
    color: var(--ink);
    background: linear-gradient(180deg, #FFFFFF, #F7F4ED);
    box-shadow:
      inset 0 0 0 4px color-mix(in srgb, var(--c) 100%, white 48%),
      inset 0 3px 0 rgba(255,255,255,0.9),
      0 7px 0 color-mix(in srgb, var(--c) 100%, black 14%),
      0 14px 26px rgba(33,37,44,0.22);
    text-shadow: none;
  }
  .m.pic img {
    width: 118px; height: 118px;
    border-radius: 16px; object-fit: cover;
  }
  .m.pic span {
    font-size: 25px; font-weight: 800;
    color: color-mix(in srgb, var(--c) 100%, black 26%);
  }
</style>
</head>
<body>

  <div class="say">
    <div class="eyebrow"><b>★</b> Ages 3–6 · works offline</div>
    <h1>Magnet&nbsp;Board</h1>
    <p class="tag">Letters, numbers, photographs,<br>colours, shapes and a boy to poke.</p>

    <div class="segmented">
      <i class="on"><s>🇬🇧</s>English</i><i class="bn"><s>🇧🇩</s>বাংলা</i><i><s>🇪🇸</s>Español</i><i><s>🇫🇷</s>Français</i>
    </div>
    <div class="foot">
      <div class="rail">
        <i class="on">A</i><i>1</i><i class="em">🍓</i><i class="em">🌈</i><i class="em">🔷</i><i class="em">🙋</i><i>★</i>
      </div>
      <span class="url"><s>https://</s>kiddo.page</span>
    </div>
  </div>

  <div class="board">
    <div class="m"     style="--c: var(--m1); --t: -3.5deg">A</div>
    <div class="m bn"  style="--c: var(--m3); --t:  3deg">অ</div>
    <div class="m"     style="--c: var(--m5); --t:  2.5deg">Ñ</div>
    <div class="m pic" style="--c: var(--m4); --t: -2.5deg">
      <img src="../photos/lion.jpg" alt=""><span>Lion</span>
    </div>
  </div>

</body>
</html>
